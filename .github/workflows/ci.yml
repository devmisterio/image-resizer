name: CI

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  LOCATION: westeurope

jobs:
  infra:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bicep build
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/eventgrid.bicep --stdout > /dev/null

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # eventgrid.bicep buraya dahil değil: hedefi olan fonksiyon ancak uygulama
      # kodu deploy edildikten sonra var olur.
      - name: Bicep what-if
        run: |
          az deployment sub what-if \
            --name image-resizer \
            --location "$LOCATION" \
            --template-file infra/main.bicep

  build:
    name: Build Function App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore src/ImageResizeFunction/ImageResizeFunction.csproj

      - name: Build
        run: |
          dotnet build src/ImageResizeFunction/ImageResizeFunction.csproj \
            --no-restore --configuration Release

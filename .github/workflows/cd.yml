name: CD

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"

jobs:
  # --- Infrastructure ---------------------------------------------------------
  infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    outputs:
      function_app_name: ${{ steps.tf-output.outputs.function_app_name }}
      resource_group_name: ${{ steps.tf-output.outputs.resource_group_name }}
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: |
          terraform apply \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="github_app_client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -auto-approve \
            -no-color

      - name: Get Terraform Outputs
        id: tf-output
        run: |
          echo "function_app_name=$(terraform output -raw function_app_name)" >> $GITHUB_OUTPUT
          echo "resource_group_name=$(terraform output -raw resource_group_name)" >> $GITHUB_OUTPUT

  # --- Application Deploy -----------------------------------------------------
  # Linux Consumption + RBAC ortamlarında Azure/functions-action paket yükleme ve sync trigger
  # adımlarında bilinen yetki/zamanlama sorunları çıkardığı için Azure CLI ZipDeploy (az functionapp deployment source config-zip)
  # yöntemi kullanılmaktadır.
  deploy:
    name: Deploy Function App
    runs-on: ubuntu-latest
    needs: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Publish
        run: |
          dotnet publish src/ImageResizeFunction/ImageResizeFunction.csproj \
            --configuration Release \
            --output ${{ github.workspace }}/publish

      - name: Package Artifacts
        run: |
          cd ${{ github.workspace }}/publish
          zip -r ${{ github.workspace }}/deploy.zip .

      - name: Wait for RBAC & Warmup SCM Site
        run: |
          echo "Waiting 30 seconds for Azure RBAC role assignments to propagate..."
          sleep 30
          echo "Restarting Function App to refresh Managed Identity credentials..."
          az functionapp restart \
            --name ${{ needs.infra.outputs.function_app_name }} \
            --resource-group ${{ needs.infra.outputs.resource_group_name }}
          echo "Waiting 15 seconds for SCM container to initialize..."
          sleep 15

      - name: Deploy via OneDeploy
        run: |
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=false

          until [ "$SUCCESS" = "true" ] || [ $RETRY_COUNT -eq $MAX_RETRIES ]; do
            echo "Attempting deployment (Attempt $((RETRY_COUNT+1))/$MAX_RETRIES)..."
            if az functionapp deploy \
                --resource-group ${{ needs.infra.outputs.resource_group_name }} \
                --name ${{ needs.infra.outputs.function_app_name }} \
                --src-path ${{ github.workspace }}/deploy.zip \
                --type zip; then
              SUCCESS=true
              echo "Deployment succeeded!"
            else
              RETRY_COUNT=$((RETRY_COUNT+1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "Deployment failed. Waiting 20 seconds before retrying..."
                sleep 20
              else
                echo "Deployment failed after $MAX_RETRIES attempts."
                exit 1
              fi
            fi
          done




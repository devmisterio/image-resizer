name: CD

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"

jobs:
  # --- Infrastructure ---------------------------------------------------------
  infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    outputs:
      function_app_name: ${{ steps.tf-output.outputs.function_app_name }}
      resource_group_name: ${{ steps.tf-output.outputs.resource_group_name }}
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: |
          terraform apply \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="github_app_client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -auto-approve \
            -no-color

      - name: Get Terraform Outputs
        id: tf-output
        run: |
          echo "function_app_name=$(terraform output -raw function_app_name)" >> $GITHUB_OUTPUT
          echo "resource_group_name=$(terraform output -raw resource_group_name)" >> $GITHUB_OUTPUT

  # --- Application Deploy -----------------------------------------------------
  # func azure functionapp publish: Azure Functions Core Tools'un deploy komutu.
  # Linux Consumption dahil tüm plan tiplerinde çalışır.
  # az login ile kurulan credential'ı otomatik kullanır.
  deploy:
    name: Deploy Function App
    runs-on: ubuntu-latest
    needs: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      # Azure Functions Core Tools v4 — func azure functionapp publish için gerekli
      - name: Install Azure Functions Core Tools
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Publish
        run: |
          dotnet publish src/ImageResizeFunction/ImageResizeFunction.csproj \
            --configuration Release \
            --output ${{ github.workspace }}/publish

      # func azure functionapp publish: Core Tools Linux Consumption'da
      # doğru deployment yöntemini (remote package) otomatik seçer.
      # --no-build: zaten dotnet publish ile derlendi, tekrar build etme.
      - name: Deploy to Azure Functions
        run: |
          cd ${{ github.workspace }}/publish
          func azure functionapp publish ${{ needs.infra.outputs.function_app_name }} \
            --dotnet-isolated \
            --no-build

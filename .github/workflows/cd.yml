name: CD

# Deployment sırası zorunludur: altyapı → uygulama kodu → Event Grid.
# Event subscription'ın hedefi olan fonksiyon, kod deploy edilmeden var olmaz.

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  LOCATION: westeurope

jobs:
  infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    outputs:
      resourceGroup: ${{ steps.deploy.outputs.resourceGroup }}
      functionApp: ${{ steps.deploy.outputs.functionApp }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        id: deploy
        run: |
          outputs=$(az deployment sub create \
            --name image-resizer \
            --location "$LOCATION" \
            --template-file infra/main.bicep \
            --query properties.outputs -o json)

          echo "resourceGroup=$(jq -r .resourceGroupName.value <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "functionApp=$(jq -r .functionAppName.value  <<< "$outputs")" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: infra
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Publish and package
        run: |
          dotnet publish src/ImageResizeFunction/ImageResizeFunction.csproj \
            --configuration Release --output ./publish
          cd publish && zip -rq ../app.zip .

      # az CLI, Flex planını algılayıp One Deploy (/api/publish) kullanır.
      # Yeni oluşturulmuş bir app'te ilk çağrı, deployment backend'i hazır olmadığı
      # için 502 dönebilir; SCM sitesi bu sırada 200 verdiğinden onu pollamak işe
      # yaramaz. Tek güvenilir hazırlık sinyali işlemin kendisinin başarılı olmasıdır.
      - name: Deploy to Function App
        run: |
          for attempt in 1 2 3 4 5; do
            if az functionapp deploy \
                 --resource-group "${{ needs.infra.outputs.resourceGroup }}" \
                 --name "${{ needs.infra.outputs.functionApp }}" \
                 --src-path app.zip --type zip; then
              exit 0
            fi
            echo "Attempt $attempt failed; deployment backend may still be initializing."
            [ "$attempt" -lt 5 ] && sleep 30
          done
          echo "::error::Deployment failed after 5 attempts."
          exit 1

      - name: Connect Event Grid
        run: |
          az deployment group create \
            --resource-group "${{ needs.infra.outputs.resourceGroup }}" \
            --name eventgrid \
            --template-file infra/eventgrid.bicep
